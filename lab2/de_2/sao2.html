<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài thơ SAO - Embed Style</title>
  <style>
    /* Embed style: định nghĩa các selector theo hướng dẫn đề bài */
    strong {
      color: brown;
    }
    .doan1 {
      color: red;
      display: block;
      margin-bottom: 1em;
    }
    .doan2 {
      color: green;
      display: block;
      margin-bottom: 1em;
    }
    .doan3 {
      color: blue;
      display: block;
      margin-bottom: 1em;
    }
  </style>
</head>
<body>

  <h2>SAO</h2>

  <em class="doan1">
    Một ngôi <strong>sao</strong> vừa rơi<br>
    Vụt tắt trên bầu trời<br>
    Hay là tên người ấy<br>
    Vụt tắt ở trong tôi ?
  </em>

  <em class="doan2">
    Vẫn thấy trên bầu trời<br>
    Có muôn vàn <strong>sao</strong> sáng<br>
    Mà ở trong lòng tôi<br>
    Như một hành lang vắng
  </em>

  <em class="doan3">
    Một ngôi <strong>sao</strong> vừa tắt<br>
    Bầu trời vẫn không buồn<br>
    <strong>Sao</strong> tên người ấy tắt<br>
    Trong lòng tôi cô đơn ?
  </em>

</body>
</html>
