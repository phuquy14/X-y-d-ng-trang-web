<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài thơ SAO - Inline Style</title>
</head>
<body>

  <h2>SAO</h2>

  <!-- Đoạn 1: Màu đỏ (red) bằng inline style -->
  <em style="color: red; display: block; margin-bottom: 1em;">
    Một ngôi <strong style="color: brown;">sao</strong> vừa rơi<br>
    Vụt tắt trên bầu trời<br>
    Hay là tên người ấy<br>
    Vụt tắt ở trong tôi ?
  </em>

  <!-- Đoạn 2: Màu xanh lá (green) bằng inline style -->
  <em style="color: green; display: block; margin-bottom: 1em;">
    Vẫn thấy trên bầu trời<br>
    Có muôn vàn <strong style="color: brown;">sao</strong> sáng<br>
    Mà ở trong lòng tôi<br>
    Như một hành lang vắng
  </em>

  <!-- Đoạn 3: Màu xanh dương (blue) bằng inline style -->
  <em style="color: blue; display: block; margin-bottom: 1em;">
    Một ngôi <strong style="color: brown;">sao</strong> vừa tắt<br>
    Bầu trời vẫn không buồn<br>
    <strong style="color: brown;">Sao</strong> tên người ấy tắt<br>
    Trong lòng tôi cô đơn ?
  </em>

</body>
</html>
