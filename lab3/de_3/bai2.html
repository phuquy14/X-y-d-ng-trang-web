<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 5.2 - Bài 2: CSS Flexbox Banner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f0f2f5;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .wrapper {
      width: 100%;
      max-width: 650px;
    }

    /* KHUNG CHÍNH SỬ DỤNG CSS FLEXBOX NHƯ HÌNH MẪU TRANG 5 */
    .banner-container {
      border: 3px solid #ff0000; /* Viền đỏ bao quanh như hình mẫu */
      display: flex;
      height: 170px;
      background-color: #f7f7f7;
    }

    /* Các khối màu bên trong Flexbox */
    .box {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 55px;
      font-weight: bold;
      color: #ffffff;
      height: 100%;
    }

    /* Khối 1: Nâu sẫm */
    .box-1 {
      flex: 1.3;
      background-color: #431f18;
    }

    /* Khối 2: Cam sáng */
    .box-2 {
      flex: 1;
      background-color: #ea9b3e;
    }

    /* Khối 3: Đỏ cam / Đất gạch */
    .box-3 {
      flex: 1;
      background-color: #c95d3f;
    }

    /* Khối 4: Xanh than (Navy) */
    .box-4 {
      flex: 1;
      background-color: #273852;
    }

    /* Khối 5: Xanh lá cây */
    .box-5 {
      flex: 1;
      background-color: #72b339;
    }

    /* Khối 6: Phần còn lại màu trắng */
    .box-empty {
      flex: 1.2;
      background-color: #f4f4f4;
    }

    /* Liên kết banner html ở dưới góc trái như hình mẫu */
    .footer-link {
      margin-top: 10px;
      font-size: 16px;
      color: #0984e3;
      text-decoration: underline;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- Khung banner flexbox -->
    <div class="banner-container">
      <div class="box box-1">1</div>
      <div class="box box-2">2</div>
      <div class="box box-3">3</div>
      <div class="box box-4">4</div>
      <div class="box box-5">5</div>
      <div class="box box-empty"></div>
    </div>

    <!-- Dòng text/link banner html -->
    <a href="#" class="footer-link">banner html</a>
  </div>

</body>
</html>
